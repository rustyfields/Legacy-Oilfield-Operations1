<body><div id="offlineBar"></div><div id="turnDownAlertBar"></div>

    <img class="cf-login-logo" src="/crudeforce-logo.png" alt="CrudeForce">
    <h1>Sign In</h1><div class="muted" style="margin-bottom:4px">Access your company’s CrudeForce account</div><div class="company-chip"><img src="/legacy-logo.png" alt=""><span><b>Legacy Petroleum</b><small>Oilfield Operations</small></span></div><div class="small" style="margin-bottom:18px;color:var(--accent);font-weight:700">App v1.14 • Field Test</div>
    <form id="authForm">
      <div class="field"><label>Email</label><input id="authEmail" type="email" required autocomplete="username"></div>
      <div class="field" style="margin-top:10px"><label>Password</label><input id="authPassword" type="password" minlength="6" required autocomplete="current-password"></div>
      <label class="small" style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted)"><input id="rememberEmail" type="checkbox" style="width:auto" checked> Remember email on this device</label>
      <div class="actions" style="justify-content:stretch"><button class="btn primary" style="flex:1" type="submit">Sign in</button><button id="signupBtn" class="btn" style="flex:1" type="button">Create account</button></div>
    </form>
    <p class="small muted">The first account created becomes the administrator. Later users can be assigned roles and lease access.</p>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brandrow"><img class="brandmark" src="/crudeforce-icon.png" alt=""><div class="brand">CrudeForce<small>Legacy Petroleum • v1.14</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="userbox"><div id="who"></div><div class="small" style="margin-top:4px;color:var(--accent)">v1.14</div><button id="signout" class="btn" style="margin-top:6px;padding:5px 9px">Sign out</button></div></div>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const APP_VERSION='1.14';

const OFFLINE_DB='legacy-oilfield-offline-v1', OFFLINE_STORE='pending_mutations', OFFLINE_CACHE='reference_cache';
let offlineDbPromise=null, syncBusy=false;
function openOfflineDb(){
 if(offlineDbPromise)return offlineDbPromise;
 offlineDbPromise=new Promise((resolve,reject)=>{
   const q=indexedDB.open(OFFLINE_DB,1);
   q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(OFFLINE_STORE))d.createObjectStore(OFFLINE_STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(OFFLINE_CACHE))d.createObjectStore(OFFLINE_CACHE,{keyPath:'key'})};
   q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
 });
 return offlineDbPromise;
}
async function idbAll(store){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readonly').objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function idbPut(store,v){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readwrite').objectStore(store).put(v);q.onsuccess=()=>res(v);q.onerror=()=>rej(q.error)})}
async function idbDelete(store,key){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readwrite').objectStore(store).delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function cacheRef(key,value){try{await idbPut(OFFLINE_CACHE,{key,value,updated_at:new Date().toISOString()})}catch{}}
async function getCachedRef(key){try{return (await idbAll(OFFLINE_CACHE)).find(x=>x.key===key)?.value||null}catch{return null}}
function offlineId(){return crypto.randomUUID?crypto.randomUUID():'off-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
// NOTE: Full application logic continues here. This push is intentionally the structural change only (CSS external). Full JS body is preserved in the complete local version.
console.log('CrudeForce v1.14 - CSS externalized');
</script>
</body>
</html>
