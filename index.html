  <style>
    :root{--bg:#0d0e10;--panel:#17191c;--panel2:#22252a;--line:#3b3f45;--text:#f2f2f0;--muted:#a8aaad;--accent:#e86f18;--accent2:#b9bdc2;--good:#22c55e;--bad:#ef4444;--blue:#3b82f6}
    *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0c0e;color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}

ttom:0}.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:#152033}.badge.good{color:#a7f3d0;border-color:#166534}.badge.warn{color:#fde68a;border-color:#92400e}.badge.bad{color:#fecaca;border-color:#991b1b}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:20;overflow:auto}.modalbox{width:min(900px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 25px 60px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#111315;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.authbox h1{margin:0 0 5px;font-size:23px}.muted{color:var(--muted)}.toast{position:fixed;right:16px;bottom:16px;background:#181a1e;border:1px solid var(--line);padding:12px 14px;border-radius:9px;z-index:40;max-width:420px}.empty{color:var(--muted);padding:18px;text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.small{font-size:12px}.notice{border-left:3px solid var(--accent);padding:10px 12px;background:#171b21;border-radius:6px;margin-bottom:12px;color:#d9dee8}.record-link{color:#93c5fd;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{margin:2px 6px 9px}.nav{display:flex;overflow:auto;gap:4px}.nav .section{display:none}.nav button{white-space:nowrap;width:auto;padding:9px 10px}.main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.formgrid,.two{grid-template-columns:1fr}}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric .value{font-size:23px}.topbar h1{font-size:20px}.main{padding:10px}.panel{padding:12px}.modal{padding:10px}.modalbox{padding:14px}.userbox{font-size:11px}}
  
#offlineBar{position:sticky;top:0;z-index:50;padding:8px 14px;text-align:center;font-weight:800;background:#fff3cd;color:#664d03;border-bottom:1px solid #ffecb5;display:none}
#offlineBar.online{background:#d1e7dd;color:#0f5132;border-color:#badbcc}
.syncPending{font-weight:800}


#turnDownAlertBar{position:sticky;top:0;z-index:49;padding:9px 14px;text-align:center;font-weight:800;background:#f8d7da;color:#842029;border-bottom:1px solid #f5c2c7;display:none;cursor:pointer}
#turnDownAlertBar .small{font-weight:600}

/* v1.9 UI/UX polish */
:root{--card-radius:16px;--chip-radius:999px}
body{line-height:1.35}
.panel{border-radius:var(--card-radius);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card{border-radius:var(--card-radius)}
.toolbar{gap:10px;align-items:center}
.toolbar h2,.toolbar h3{letter-spacing:-.01em}
.btn{border-radius:10px;font-weight:700}
.btn.primary{font-weight:800;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.small.muted{opacity:.78}
.statusline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.statuschip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:var(--chip-radius);font-size:12px;font-weight:800;border:1px solid currentColor;background:rgba(255,255,255,.55)}
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:700;opacity:.78;margin-bottom:8px}
.breadcrumb .sep{opacity:.45}
@media (max-width:680px){
  .panel,.card{padding:14px}
  .toolbar{align-items:flex-start}
  .btn{min-height:42px}
  input,select,textarea{font-size:16px}
}


/* v1.10 branding + drill-down */
#app::before{content:"";position:fixed;inset:0;background:url('/legacy-logo.png') center 56%/min(52vw,560px) auto no-repeat;opacity:.035;pointer-events:none;z-index:0}
#app .sidebar,#app .main{position:relative;z-index:1}
.authlogo{display:block;width:150px;max-width:45vw;margin:0 auto 14px;filter:drop-shadow(0 8px 18px #0008)}
.brandrow{display:flex;align-items:center;gap:10px}.brandmark{width:42px;height:42px;object-fit:contain;flex:0 0 auto}
.metric.clickable{cursor:pointer;transition:transform .12s ease,border-color .12s ease}.metric.clickable:hover{transform:translateY(-1px);border-color:var(--accent)}.metric.clickable:active{transform:translateY(0)}
.metric .hint{font-size:10px;color:var(--muted);margin-top:4px}.leasechecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;padding:10px;border:1px solid var(--line);border-radius:10px}.leasechecks label{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13px}.leasechecks input{width:auto}
.logo-note{display:flex;align-items:center;gap:10px}.logo-note img{width:56px;height:56px;object-fit:contain}


/* v1.16 CrudeForce branding */
.authwrap{background:linear-gradient(rgba(5,5,5,.20),rgba(5,5,5,.42)),url('/crudeforce-login-flag.png') center/cover fixed no-repeat;position:relative}
.authwrap.hidden{display:none!important}
.authwrap:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.38) 100%);pointer-events:none}
.authbox{position:relative;z-index:1;background:rgba(18,19,21,.88);border-color:rgba(232,111,24,.48);backdrop-filter:blur(9px);box-shadow:0 25px 70px #000b}
.cf-login-logo{display:block;width:min(310px,90%);height:auto;margin:0 auto 14px;background:#fff;border-radius:8px;padding:5px}
.company-chip{display:flex;align-items:center;gap:10px;margin:14px 0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.06)}
.company-chip img{width:36px;height:36px;object-fit:contain}.company-chip span{display:flex;flex-direction:column}.company-chip small{color:var(--muted);font-size:11px;margin-top:2px}
.nav button.active{box-shadow:inset 3px 0 0 var(--accent);background:#282a2e}.btn.primary{background:linear-gradient(180deg,#f47d24,#d85d0d);border-color:#f47d24;color:#160b03}.record-link{color:#f39a5a}

/* v1.16 Field UX */
:root{--warn:#f59e0b;--info:#38bdf8}
.quickbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.searchbox{position:relative;min-width:min(360px,48vw)}
.searchbox input{padding-left:36px;background:#111315;border-color:#4a4e55}
.searchbox:before{content:"⌕";position:absolute;left:12px;top:8px;color:var(--muted);font-size:20px}
.searchresults{position:absolute;z-index:60;top:44px;left:0;right:0;background:#17191c;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px #000b;max-height:55vh;overflow:auto}
.searchresult{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text)}
.searchresult:last-child{border-bottom:0}.searchresult:hover{background:var(--panel2)}
.searchresult b{display:block}.searchresult small{color:var(--muted)}
.opsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.attn{border-left:4px solid var(--warn)}.attn.bad{border-left-color:var(--bad)}.attn.good{border-left-color:var(--good)}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filterbar input,.filterbar select{width:auto;min-width:150px}
.mobilecards{display:none}.recordcard{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}
.recordcard .rc-title{font-size:16px;font-weight:800}.recordcard .rc-meta{font-size:12px;color:var(--muted);margin:4px 0 9px}.recordcard .rc-actions{display:flex;gap:7px;flex-wrap:wrap}
.tankfill{height:9px;background:#0d0f11;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.tankfill>span{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444)}
.bottomnav{display:none}
@media(max-width:900px){
 .sidebar{padding:8px 10px}.brandrow{justify-content:center}.sidebar .nav{display:none}
 .main{padding-bottom:82px}.topbar{position:sticky;top:0;z-index:35;background:rgba(11,12,14,.94);backdrop-filter:blur(10px);padding:8px 0;margin-bottom:12px}
 .topbar{flex-wrap:wrap}.searchbox{order:3;width:100%;min-width:100%}
 .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:#15171a;border-top:1px solid var(--line);padding:5px max(5px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));box-shadow:0 -8px 30px #0008}
 .bottomnav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px;font-weight:800;border-radius:9px}.bottomnav button.active{color:var(--accent);background:#282a2e}
 .bottomnav .ico{display:block;font-size:19px;line-height:20px;margin-bottom:2px}
 .opsgrid{grid-template-columns:1fr 1fr}
 .desktopTable{display:none!important}.mobilecards{display:block}
}
@media(max-width:520px){.opsgrid{grid-template-columns:1fr}.userbox #who{display:none}.userbox .small{display:none}.topbar h1{font-size:19px}}

const OFFLINE_DB='legacy-oilfield-offline-v1', OFFLINE_STORE='pending_mutations', OFFLINE_CACHE='reference_cache';
let offlineDbPromise=null, syncBusy=false;
function openOfflineDb(){
 if(offlineDbPromise)return offlineDbPromise;
 offlineDbPromise=new Promise((resolve,reject)=>{
   const q=indexedDB.open(OFFLINE_DB,1);
   q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains(OFFLINE_STORE))d.createObjectStore(OFFLINE_STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(OFFLINE_CACHE))d.createObjectStore(OFFLINE_CACHE,{keyPath:'key'})};
   q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
 });
 return offlineDbPromise;
}
async function idbAll(store){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readonly').objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function idbPut(store,v){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readwrite').objectStore(store).put(v);q.onsuccess=()=>res(v);q.onerror=()=>rej(q.error)})}
async function idbDelete(store,key){const d=await openOfflineDb();return new Promise((res,rej)=>{const q=d.transaction(store,'readwrite').objectStore(store).delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function cacheRef(key,value){try{await idbPut(OFFLINE_CACHE,{key,value,updated_at:new Date().toISOString()})}catch{}}
async function getCachedRef(key){try{return (await idbAll(OFFLINE_CACHE)).find(x=>x.key===key)?.value||null}catch{return null}}
function offlineId(){return crypto.randomUUID?crypto.randomUUID():'off-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
async function queueMutation(table,action,payload,match=null){
 const item={id:offlineId(),table,action,payload,match,queued_at:new Date().toISOString(),user_id:me?.id||null,status:'pending',attempts:0};
 await idbPut(OFFLINE_STORE,item);await updateOfflineBar();return item;
}
async function pendingCount(){return (await idbAll(OFFLINE_STORE)).filter(x=>x.status==='pending'||x.status==='conflict').length}
async function updateOfflineBar(message=''){
 const el=document.getElementById('offlineBar');if(!el)return;
 let n=0;try{n=await pendingCount()}catch{}
 if(!navigator.onLine){el.className='';el.style.display='block';el.innerHTML=`OFFLINE • ${n} change${n===1?'':'s'} waiting to sync`;return}
 if(message){el.className='online';el.style.display='block';el.textContent=message;setTimeout(()=>{if(n===0)el.style.display='none'},4000);return}
 if(n){el.className='online';el.style.display='block';el.innerHTML=`ONLINE • <span class="syncPending">${n} change${n===1?'':'s'} waiting to sync</span>`}
 else el.style.display='none';
}
function looksNetworkError(e){const m=String(e?.message||e||'').toLowerCase();return !navigator.onLine||m.includes('fetch')||m.includes('network')||m.includes('failed to fetch')}
async function saveWithOffline(table,action,payload,match=null){
 if(!navigator.onLine){await queueMutation(table,action,payload,match);return {queued:true}}
 try{
   let q=sb.from(table);
   let r;
   if(action==='insert')r=await q.insert(payload);
   else if(action==='update'){q=q.update(payload);for(const [k,v] of Object.entries(match||{}))q=q.eq(k,v);r=await q}
   else throw new Error('Unsupported offline action');
   if(r.error)throw r.error;
   return {queued:false,data:r.data}
 }catch(e){
   if(looksNetworkError(e)){await queueMutation(table,action,payload,match);return {queued:true}}
   throw e;
 }
}
async function syncPendingMutations(){
 if(syncBusy||!navigator.onLine||!me)return;
 syncBusy=true;let ok=0,conflicts=0;
 try{
   const items=(await idbAll(OFFLINE_STORE)).filter(x=>x.status==='pending').sort((a,b)=>new Date(a.queued_at)-new Date(b.queued_at));
   for(const item of items){
     try{
       let q=sb.from(item.table),r;
       if(item.action==='insert')r=await q.insert(item.payload);
       else if(item.action==='update'){q=q.update(item.payload);for(const [k,v] of Object.entries(item.match||{}))q=q.eq(k,v);r=await q}
       if(r?.error)throw r.error;
       await idbDelete(OFFLINE_STORE,item.id);ok++;
     }catch(e){
       item.attempts=(item.attempts||0)+1;item.last_error=String(e?.message||e);
       if(!looksNetworkError(e)&&item.attempts>=2){item.status='conflict';conflicts++}
       await idbPut(OFFLINE_STORE,item);
       if(looksNetworkError(e))break;
     }
   }
 }finally{
   syncBusy=false;
   const left=await pendingCount();
   await updateOfflineBar(conflicts?`${ok} synced • ${conflicts} require review`:ok?`${ok} offline change${ok===1?'':'s'} synced${left?` • ${left} remaining`:''}`:'');
   if(ok){try{await loadRefs();if(current==='tankgauges')await listTankGauges()}catch{}}
 }
}
window.addEventListener('offline',()=>updateOfflineBar());
window.addEventListener('online',()=>{updateOfflineBar('Signal restored • synchronizing…');syncPendingMutations()});

 {value:'csf',label:'Catlett-Sands-Foraker',leases:['Catlett','Sands','Foraker']},
 {value:'cbg',label:'Chapman-Borrums-Gibbs',leases:['Chapman','Borrums','Gibbs']},
 {value:'Chance',label:'Chance',leases:['Chance']},
 {value:'James',label:'James',leases:['James']},
 {value:'Liz',label:'Liz',leases:['Liz']},

 {value:'Newly',label:'Newly',leases:['Newly']},
 {value:'Nomo',label:'Nomo',leases:['Nomo']}
];
function oilBatteryForRecord(x={}){
 const n=leaseName(x.lease_id);
 if(['Catlett','Sands','Foraker'].includes(n))return 'csf';
 if(['Chapman','Borrums','Gibbs'].includes(n))return 'cbg';
 return n||'';
}
function oilBatteryLabel(x={}){const v=oilBatteryForRecord(x);return OIL_BATTERIES.find(b=>b.value===v)?.label||(leaseName(x.lease_id)||'');}
function oilBatteryLeaseId(v){
 const b=OIL_BATTERIES.find(x=>x.value===v);if(!b)return null;
 // Existing schema stores lease_id. Use a stable representative lease for consolidated batteries while UI/reporting uses the battery name.
 const representative=v==='csf'?'Catlett':v==='cbg'?'Chapman':b.leases[0];
 return refs.leases.find(l=>l.name===representative)?.id||null;
}
function oilBatteryForTank(t={}){
 const n=(t.lease_name||'').trim();
 const exact=OIL_BATTERIES.find(b=>b.label===n||b.leases.includes(n));
 return exact?.value||'';
}

}

function gaugeTotalInches(ft,inch){
 const f=Number(ft),i=Number(inch);
 if(!Number.isFinite(f)||!Number.isFinite(i)||i<0||i>=12)return null;
 return f*12+i;
}
function updatePurchaserGaugeVariance(){
 const f=document.querySelector('#modal form');if(!f)return;
 const box=f.querySelector('#purchaserGaugeVariance');if(!box)return;
 const of=gaugeTotalInches(f.elements.operator_gauge_feet?.value,f.elements.operator_gauge_inches?.value);
 const pf=gaugeTotalInches(f.elements.purchaser_gauge_feet?.value,f.elements.purchaser_gauge_inches?.value);
 if(of==null||pf==null){box.textContent='Enter both operator and purchaser top gauges to calculate variance.';return}
 const tankId=f.dataset.tankId, t=refs.tanks.find(x=>x.id===tankId);
 const d=pf-of, b=t?d*Number(t.multiplier):null;
 const direction=d<0?`Purchaser measured ${Math.abs(d).toFixed(3)} in lower than operator`:d>0?`Purchaser measured ${d.toFixed(3)} in higher than operator`:'Purchaser and operator gauges match';
 box.textContent=`${direction}${b==null?'':` • volume variance ${b>=0?'+':''}${b.toFixed(2)} bbl`}`;
}

function openTankPickup(tankId){
 const t=refs.tanks.find(x=>x.id===tankId);if(!t)return toast('Tank configuration not found.');
 const pending=(tankOilSalesCache||[])
   .filter(s=>(s.tank_id===t.id || (!s.tank_id&&String(s.tank_number)===String(t.tank_number))) && s.status!=='picked_up')
   .sort((a,b)=>new Date(b.called_in_at||0)-new Date(a.called_in_at||0))[0];
 if(!pending)return toast('No open called-in tank record found. Call the tank in first.');
 const latest=latestGaugeForTank(t.id);
 const seeded={...pending};
 if(latest && seeded.operator_gauge_feet==null){
   seeded.operator_gauge_feet=latest.gauge_feet;
   seeded.operator_gauge_inches=latest.gauge_inches;
 }
 openModal(`Record oil haul / run ticket - ${tankMasterLabel(t)}`,tankPickupForm(t,seeded),async f=>{
   const o=Object.fromEntries(f);
   o.picked_up_at=iso(o.picked_up_at);
   o.gross_bbl_hauled=Number(o.gross_bbl_hauled);
   o.status='picked_up';
   for(const k of ['operator_gauge_feet','operator_gauge_inches','purchaser_gauge_feet','purchaser_gauge_inches','purchaser_bottom_gauge_feet','purchaser_bottom_gauge_inches']){
     o[k]=o[k]===''?null:Number(o[k]);
   }
   const bottomFt=o.purchaser_bottom_gauge_feet,bottomIn=o.purchaser_bottom_gauge_inches;
   if((bottomFt==null)!=(bottomIn==null))throw new Error('Enter both purchaser bottom-gauge feet and inches, or leave both blank.');
   if(bottomIn!=null&&(bottomIn<0||bottomIn>=12))throw new Error('Purchaser bottom-gauge inches must be between 0 and less than 12.');
   const op=gaugeTotalInches(o.operator_gauge_feet,o.operator_gauge_inches);
   const pu=gaugeTotalInches(o.purchaser_gauge_feet,o.purchaser_gauge_inches);
   if(op!=null&&pu!=null){
     o.gauge_variance_inches=Number((pu-op).toFixed(3));
     o.gauge_variance_bbl=Number(((pu-op)*Number(t.multiplier)).toFixed(2));
     o.gauge_variance_flag=Math.abs(pu-op)>=0.5;
   }else{
     o.gauge_variance_inches=null;o.gauge_variance_bbl=null;o.gauge_variance_flag=false;
   }
   if(!o.purchaser)o.purchaser=null;
   if(!o.run_ticket_number)o.run_ticket_number=null;
   if(!o.notes)o.notes=null;
   const r=await saveWithOffline('oil_sales_pickups','update',o,{id:pending.id});if(r.queued)toast('Run ticket saved offline • waiting to sync');
   await listTankGauges();
   renderTankLease(tankLeaseKey(t));
 });
 const form=document.querySelector('#modal form');if(form)form.dataset.tankId=t.id;
 setTimeout(updatePurchaserGaugeVariance,0);
}

async function listOil(){
 await loadOilSaleDeleteRequests();
 const {data=[]}=await sb.from('oil_sales_pickups').select('*').is('deleted_at',null).order('called_in_at',{ascending:false});
 const rows=data.map(x=>{
   let delay='';if(x.called_in_at&&x.picked_up_at)delay=((new Date(x.picked_up_at)-new Date(x.called_in_at))/36e5).toFixed(1)+' hr';
   const gross=x.gross_bbl_hauled==null?'':Number(x.gross_bbl_hauled).toFixed(2);
   return `<tr><td><button class="btn editOil" data-id="${x.id}">Open / Edit</button> ${oilSaleDeleteAction(x)}</td><td>${esc(oilBatteryLabel(x))}</td><td>${esc(x.tank_number)}</td><td>${esc(x.purchaser||'')}</td><td>${esc(x.confirmation_number||'')}</td><td>${x.called_in_at?new Date(x.called_in_at).toLocaleString():''}</td><td>${x.picked_up_at?new Date(x.picked_up_at).toLocaleString():''}</td><td>${gross}</td><td>${badge(x.status)}</td><td>${delay}</td></tr>`;
 });
 const now=new Date(), day=(now.getDay()+6)%7;
 const weekStart=new Date(now);weekStart.setHours(0,0,0,0);weekStart.setDate(now.getDate()-day);
 const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+7);
 const weekly=data.filter(x=>x.picked_up_at&&new Date(x.picked_up_at)>=weekStart&&new Date(x.picked_up_at)<weekEnd&&x.gross_bbl_hauled!=null);
 const byBattery={};let total=0;
 weekly.forEach(x=>{const n=oilBatteryLabel(x)||'Unknown';const v=Number(x.gross_bbl_hauled)||0;byBattery[n]=(byBattery[n]||0)+v;total+=v});
 const summaryRows=Object.entries(byBattery).sort((a,b)=>a[0].localeCompare(b[0])).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.toFixed(2)}</td></tr>`);
 const summary=`<div class="panel" style="margin-bottom:16px"><h2>Current Week Gross Oil Sold</h2><div class="small muted">${weekStart.toLocaleDateString()} through ${new Date(weekEnd-1).toLocaleDateString()}</div>${summaryRows.length?table(['Sales Battery','Gross BBLS Hauled'],summaryRows)+`<div style="margin-top:10px"><b>Weekly Total: ${total.toFixed(2)} bbl</b></div>`:'<div class="notice" style="margin-top:10px">No pickups with gross barrels entered for the current week yet.</div>'}</div>`;
 $('#content').innerHTML=`${summary}<div class="panel"><div class="toolbar"><button class="btn primary" id="newO">New call-in</button></div><div class="notice">Oil sales are recorded by physical sales battery. Enter Gross BBLS Hauled when the purchaser pickup quantity is known. Weekly totals above are calculated from pickup date/time.</div>${table(['Action','Sales Battery','Tank','Purchaser','Confirmation','Called In','Picked Up','Gross BBLS','Status','Delay'],rows)}</div>`;
 document.querySelectorAll('.editOil').forEach(b=>b.onclick=()=>editOil(b.dataset.id));
 bindOilDeleteActions();
 $('#newO').onclick=()=>openModal('Oil sale / pickup',oilForm({status:'awaiting_pickup'}),async f=>{const o=oilPayload(f);o.created_by=me.id;const {error}=await sb.from('oil_sales_pickups').insert(o);if(error)throw error});
}

function updateTankAdjustmentPreview(){
 const f=document.querySelector('#modal form');if(!f)return;
 const box=f.querySelector('#tankAdjustmentPreview');if(!box)return;
 const t=refs.tanks.find(x=>x.id===f.dataset.tankId);if(!t){box.textContent='Tank not found.';return}
 const bt=gaugeTotalInches(f.elements.before_top_feet?.value,f.elements.before_top_inches?.value);
 const bb=gaugeTotalInches(f.elements.before_bottom_feet?.value,f.elements.before_bottom_inches?.value);
 const afterVals=['after_top_feet','after_top_inches','after_bottom_feet','after_bottom_inches'].map(k=>f.elements[k]?.value);
 const anyAfter=afterVals.some(v=>v!==''&&v!=null), allAfter=afterVals.every(v=>v!==''&&v!=null);
 if(bt==null||bb==null){box.textContent='Enter the turn-down top and bottom gauges.';return}
 if(!anyAfter){box.textContent='Turn-down recorded. Resolution gauges can be added later.';return}
 if(!allAfter){box.textContent='Finish all four resolution gauge fields to calculate material removed.';return}
 const at=gaugeTotalInches(afterVals[0],afterVals[1]),ab=gaugeTotalInches(afterVals[2],afterVals[3]);
 if(at==null||ab==null){box.textContent='Check the resolution gauge values.';return}
 const mult=Number(t.multiplier);
 const material=(bb-ab)*mult, total=(bt-at)*mult;
 const reported=Number(f.elements.hauler_reported_bbl?.value);
 const warn=ab>bb?' WARNING: after-bottom gauge is higher than before-bottom gauge.':'';
 const v=Number.isFinite(reported)&&f.elements.hauler_reported_bbl.value!==''?` • hauler variance ${(reported-material)>=0?'+':''}${(reported-material).toFixed(2)} bbl`:'';
 box.textContent=`Calculated material removed ${material.toFixed(2)} bbl • total tank volume change ${total.toFixed(2)} bbl${v}${warn}`;
}
function tankAdjustmentPayload(f,t,existing=null){
 const o=Object.fromEntries(f);
 o.tank_id=t.id;
 const openSale=(tankOilSalesCache||[]).filter(s=>(s.tank_id===t.id||(!s.tank_id&&String(s.tank_number)===String(t.tank_number)))&&s.status!=='picked_up').sort((a,b)=>new Date(b.called_in_at||0)-new Date(a.called_in_at||0))[0];
 if(!openSale)throw new Error('This tank has not been called in. Create the call-in before starting a turn-down record.');
 o.oil_sale_id=existing?.oil_sale_id||openSale.id;
 o.adjustment_at=iso(o.adjustment_at);
 o.turned_down_at=existing?.turned_down_at||o.adjustment_at;
 const material=refs.removalTypes.find(r=>r.id===o.material_type_id);
 o.material_name_snapshot=material?.name||existing?.material_name_snapshot||'Other';
 const before=['before_top_feet','before_top_inches','before_bottom_feet','before_bottom_inches'];
 for(const k of before)o[k]=Number(o[k]);
 const after=['after_top_feet','after_top_inches','after_bottom_feet','after_bottom_inches'];
 const hasAnyAfter=after.some(k=>o[k]!==''&&o[k]!=null), hasAllAfter=after.every(k=>o[k]!==''&&o[k]!=null);
 if(hasAnyAfter&&!hasAllAfter)throw new Error('Enter all four resolution gauge fields, or leave all four blank until corrective work is complete.');
 for(const k of after)o[k]=hasAllAfter?Number(o[k]):null;
 o.multiplier_used=Number(t.multiplier);
 const bt=gaugeTotalInches(o.before_top_feet,o.before_top_inches),bb=gaugeTotalInches(o.before_bottom_feet,o.before_bottom_inches);
 if(hasAllAfter){
   const at=gaugeTotalInches(o.after_top_feet,o.after_top_inches),ab=gaugeTotalInches(o.after_bottom_feet,o.after_bottom_inches);
   if(ab>bb)throw new Error('After bottom gauge is higher than before bottom gauge. Check the readings before saving.');
   o.calculated_material_removed_bbl=Number(((bb-ab)*o.multiplier_used).toFixed(2));
   o.calculated_total_volume_change_bbl=Number(((bt-at)*o.multiplier_used).toFixed(2));
 }else{
   o.calculated_material_removed_bbl=null;o.calculated_total_volume_change_bbl=null;
 }
 o.hauler_reported_bbl=o.hauler_reported_bbl===''?null:Number(o.hauler_reported_bbl);
 o.hauler_variance_bbl=(o.hauler_reported_bbl==null||o.calculated_material_removed_bbl==null)?null:Number((o.hauler_reported_bbl-o.calculated_material_removed_bbl).toFixed(2));
 const roles=[];
 if(o.notify_field_operator==='on')roles.push('field_operator');
 if(o.notify_supervisor==='on')roles.push('supervisor');
 if(o.notify_office==='on')roles.push('office');
 if(o.notify_admin==='on')roles.push('admin');
 delete o.notify_field_operator;delete o.notify_supervisor;delete o.notify_office;delete o.notify_admin;
 o.notify_roles=roles.length?roles:['supervisor'];
 const resolved=['resolved','closed'].includes(o.status);
 o.alert_active=!resolved;
 o.resolved_at=resolved?(existing?.resolved_at||new Date().toISOString()):null;
 for(const k of ['purchaser','hauler','reason','resolution_notes','notes'])if(!o[k])o[k]=null;
 return o;
}
function openTankAdjustment(tankId){

 if(!openSale)return toast('No open called-in tank record found. Call the tank in first.');

 const latest=latestGaugeForTank(t.id);
 const seed=existing?{...existing}:{status:'turned_down',notify_roles:['field_operator','supervisor']};
 if(!existing&&latest){seed.before_top_feet=latest.gauge_feet;seed.before_top_inches=latest.gauge_inches}
 openModal(`${existing?'Update':'Start'} turn-down record - ${tankMasterLabel(t)}`,tankAdjustmentForm(t,seed),async f=>{
   const o=tankAdjustmentPayload(f,t,existing);
   let r;

   else{o.created_by=me.id;r=await saveWithOffline('tank_adjustments','insert',o)}

 });

 setTimeout(updateTankAdjustmentPreview,0);
}

function updateGaugePreview(){
 const f=document.querySelector('#modal form');if(!f)return;
 const tank=refs.tanks.find(t=>t.id===f.elements.tank_id?.value);
 const ftRaw=f.elements.gauge_feet?.value, inRaw=f.elements.gauge_inches?.value;
 const ft=Number(ftRaw||0), inches=Number(inRaw||0);
 const p=document.querySelector('#gaugePreview'), prevBox=document.querySelector('#previousGaugeInfo'), period=document.querySelector('#gaugePeriodPreview');
 if(!p)return;
 const editId=null;
 const prev=tank?latestGaugeForTank(tank.id,editId):null;
 if(prevBox)prevBox.textContent=prev?`${prev.gauge_feet}' ${Number(prev.gauge_inches).toFixed(3)}" • ${Number(prev.calculated_bbl).toFixed(2)} bbl • ${new Date(prev.gauged_at).toLocaleString()}`:'No previous gauge for this tank.';
 if(!tank||ftRaw===''||inRaw===''||inches<0||inches>=12){p.textContent='Select tank and enter a valid current gauge.';if(period)period.textContent='Previous reading, haul volume, and inventory movement will appear here.';return}
 const total=ft*12+inches, bbl=total*Number(tank.multiplier);
 const room=tank.capacity_bbl==null?null:Number(tank.capacity_bbl)-bbl;
 p.textContent=`${total.toFixed(3)} total in × ${Number(tank.multiplier).toFixed(4)} = ${bbl.toFixed(2)} bbl${room==null?'':` • available room ${room.toFixed(2)} bbl`}`;
 if(period){
   if(!prev){period.textContent='First recorded gauge for this tank. No prior-period production calculation yet.';return}
   const now=iso(f.elements.gauged_at?.value);
   const hauled=tankOilSalesCache.filter(s=>{
     const linked=s.tank_id===tank.id || (!s.tank_id && String(s.tank_number)===String(tank.tank_number));
     return linked && s.picked_up_at && new Date(s.picked_up_at)>new Date(prev.gauged_at) && (!now || new Date(s.picked_up_at)<=new Date(now)) && s.gross_bbl_hauled!=null;
   }).reduce((n,s)=>n+Number(s.gross_bbl_hauled||0),0);
   const change=bbl-Number(prev.calculated_bbl);
   const est=change+hauled;
   period.textContent=`Inventory change ${change>=0?'+':''}${change.toFixed(2)} bbl • oil hauled ${hauled.toFixed(2)} bbl • estimated produced oil ${est.toFixed(2)} bbl`;
 }
}
function tankGaugePayload(f){

 if(o.gauge_inches<0||o.gauge_inches>=12)throw new Error('Gauge inches must be between 0 and less than 12.');
 o.multiplier_used=Number(tank.multiplier);o.calculated_bbl=Number(((o.gauge_feet*12+o.gauge_inches)*o.multiplier_used).toFixed(2));
 if(!o.notes)o.notes=null;return o
}

function tankTransportStatusForLease(tanks=[]){
 const ids=new Set(tanks.map(t=>t.id));
 const numbers=new Set(tanks.map(t=>String(t.tank_number)));
 const open=(tankOilSalesCache||[]).filter(s=>{
   const linked=(s.tank_id&&ids.has(s.tank_id))||(!s.tank_id&&numbers.has(String(s.tank_number)));
   return linked && s.status!=='picked_up';
 });
 const turnedDownIds=new Set((tankAdjustmentCache||[]).filter(a=>a.alert_active && ids.has(a.tank_id)).map(a=>a.tank_id));
 const waiting=[],turned=[];
 for(const sale of open){
   const t=tanks.find(x=>x.id===sale.tank_id)||tanks.find(x=>String(x.tank_number)===String(sale.tank_number));
   if(!t)continue;
   if(turnedDownIds.has(t.id))turned.push(String(t.tank_number));
   else waiting.push(String(t.tank_number));
 }
 return {waiting:[...new Set(waiting)].sort(naturalCompare),turned:[...new Set(turned)].sort(naturalCompare)};
}

function tankGaugeStatusForLease(tanks=[]){
 let latest=null,total=0,known=0,nearlyFull=false;
 for(const t of tanks){
   const g=(tankGaugeHistoryCache[t.id]||[])[0];
   if(g){
     if(!latest||new Date(g.gauged_at)>new Date(latest))latest=g.gauged_at;
     total+=Number(g.calculated_bbl||0);known++;
     if(t.capacity_bbl!=null && Number(t.capacity_bbl)>0 && Number(g.calculated_bbl)/Number(t.capacity_bbl)>=.9)nearlyFull=true;
   }
 }
 return {latest,total,known,nearlyFull}
}

 const d=new Date(anchor);d.setHours(12,0,0,0);let a=new Date(d),b=new Date(d);
 if(period==='weekly'){const day=(d.getDay()+6)%7;a.setDate(d.getDate()-day);b=new Date(a);b.setDate(a.getDate()+6)}

 const chemRows=(chem.data||[]).map(x=>`<tr><td>${x.treatment_at?new Date(x.treatment_at).toLocaleString():''}</td><td>${esc(x.well_id?wellName(x.well_id):leaseName(x.lease_id))}</td><td>${esc(x.chemical_product||'')}</td><td>${esc(x.quantity??'')} ${esc(x.quantity_unit||'')}</td><td>${esc(x.duration_minutes??'')}</td></tr>`);

 const openItems=work.filter(x=>!x.rig_move_out_at||!x.returned_to_production_at).map(x=>`${esc(wellName(x.well_id))}: ${esc(x.reason_for_pulling||'Open workover')}`).concat(statuses.filter(x=>x.follow_up_required).map(x=>`${esc(wellName(x.well_id))}: ${esc(x.follow_up_note||x.observation||'Follow-up required')}`));
 $('#content').innerHTML=`<div class="panel">${reportHeader('Operations Summary')}<h3>Wells Down / Under Workover</h3>${down.length?table(['Event','Well','Status','Information'],eventRows(down)):'<div class="empty">None recorded.</div>'}<h3>Workovers Active During Period</h3>${workRows.length?table(['Action','Well','State','Move-In','Move-Out','Period Rig Hours','Findings / Reason'],workRows):'<div class="empty">None recorded.</div>'}<h3>Returned to Production</h3>${rtp.length?table(['Event','Well','Status','Information'],eventRows(rtp)):'<div class="empty">None recorded.</div>'}<h3>Chemical Treatments</h3>${chemRows.length?table(['Date','Well / Target','Chemical','Quantity','Minutes'],chemRows):'<div class="empty">No chemical treatments recorded.</div>'}<h3>Acid Jobs</h3>${acidRows.length?table(['Date','Well','Acid','Gallons','Outcome'],acidRows):'<div class="empty">No acid jobs recorded.</div>'}<h3>Oil Sales / Hauling</h3>${haulRows.length?table(['Pickup','Battery / Lease','Tank','Gross bbl','Confirmation'],haulRows):'<div class="empty">No pickups recorded.</div>'}<h3>Issues and Resolutions</h3>${incidentRows.length?table(['Discovered','Lease','Type','Status','Summary'],incidentRows):'<div class="empty">No incidents recorded.</div>'}<h3>Carryover / Open Items</h3><div>${openItems.join('<br>')||'No carryover items recorded in this period.'}</div>${reportBottom()}</div>`;
