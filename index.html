<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Legacy Petroleum Oilfield Operations</title>
  <style>
    :root{--bg:#0b1220;--panel:#111827;--panel2:#182235;--line:#2a374c;--text:#eef2f7;--muted:#9aa7b8;--accent:#f59e0b;--good:#22c55e;--bad:#ef4444;--blue:#3b82f6}
    *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08101c;color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:18px;line-height:1.2;margin:0 8px 18px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--panel2)}.nav .section{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:17px 10px 5px}.main{padding:22px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.topbar h1{font-size:24px;margin:0}.userbox{font-size:13px;color:var(--muted);text-align:right}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1f1600;font-weight:700}.btn.danger{background:#3a1720;border-color:#6b202d}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:800;margin-top:4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}.panel h2{margin:0 0 12px;font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{text-align:left;color:var(--muted);font-weight:600;background:#0f1828}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:#152033}.badge.good{color:#a7f3d0;border-color:#166534}.badge.warn{color:#fde68a;border-color:#92400e}.badge.bad{color:#fecaca;border-color:#991b1b}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:20;overflow:auto}.modalbox{width:min(900px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 25px 60px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0c1524;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.authbox h1{margin:0 0 5px;font-size:23px}.muted{color:var(--muted)}.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;border:1px solid var(--line);padding:12px 14px;border-radius:9px;z-index:40;max-width:420px}.empty{color:var(--muted);padding:18px;text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.small{font-size:12px}.notice{border-left:3px solid var(--accent);padding:10px 12px;background:#171b21;border-radius:6px;margin-bottom:12px;color:#d9dee8}.record-link{color:#93c5fd;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{margin:2px 6px 9px}.nav{display:flex;overflow:auto;gap:4px}.nav .section{display:none}.nav button{white-space:nowrap;width:auto;padding:9px 10px}.main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.formgrid,.two{grid-template-columns:1fr}}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric .value{font-size:23px}.topbar h1{font-size:20px}.main{padding:10px}.panel{padding:12px}.modal{padding:10px}.modalbox{padding:14px}.userbox{font-size:11px}}
  </style>
</head>
<body>
<div id="auth" class="authwrap">
  <div class="authbox">
    <h1>Legacy Petroleum</h1><div class="muted" style="margin-bottom:18px">Oilfield Operations</div>
    <form id="authForm">
      <div class="field"><label>Email</label><input id="authEmail" type="email" required autocomplete="username"></div>
      <div class="field" style="margin-top:10px"><label>Password</label><input id="authPassword" type="password" minlength="6" required autocomplete="current-password"></div>
      <label class="small" style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted)"><input id="rememberEmail" type="checkbox" style="width:auto" checked> Remember email on this device</label>
      <div class="actions" style="justify-content:stretch"><button class="btn primary" style="flex:1" type="submit">Sign in</button><button id="signupBtn" class="btn" style="flex:1" type="button">Create account</button></div>
    </form>
    <p class="small muted">The first account created becomes the administrator. Later users can be assigned roles and lease access.</p>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">Legacy Petroleum<small>Oilfield Operations</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="userbox"><div id="who"></div><button id="signout" class="btn" style="margin-top:6px;padding:5px 9px">Sign out</button></div></div>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xxtwsaebnxsdgygxaekj.supabase.co';
const SUPABASE_KEY='sb_publishable_I5FfFfwpAUPTH7d-6SfbyQ_qRZAOEC4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null, current='dashboard', refs={leases:[],wells:[],contractors:[]};
const modules=[
 ['dashboard','Dashboard'],['status','Daily Operations'],['workovers','Workovers'],['incidents','Incidents / Spills'],['acid','Acid Jobs'],['chemical','Chemical Treatments'],['oil','Oil Sales / Pickup'],['equipment','Equipment'],['wells','Well Master'],['contractors','Contractors'],['admin','Users / Access']
];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3200)}
function dtlocal(v){if(!v)return '';const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function iso(v){return v?new Date(v).toISOString():null}
function badge(v){const x=String(v||'').toLowerCase();const c=x.includes('final')||x.includes('running')||x.includes('complete')||x.includes('picked')?'good':x.includes('down')||x.includes('active_response')?'bad':'warn';return `<span class="badge ${c}">${esc(v||'')}</span>`}
function leaseName(id){return refs.leases.find(x=>x.id===id)?.name||''} function wellName(id){const w=refs.wells.find(x=>x.id===id);return w?`${leaseName(w.lease_id)} ${w.well_number}`:''} function contractorName(id){return refs.contractors.find(x=>x.id===id)?.name||''}
async function loadProfile(){const {data}=await sb.from('profiles').select('*').eq('user_id',me.id).single();profile=data;$('#who').innerHTML=`${esc(profile?.display_name||me.email)}<br><span class="badge">${esc(profile?.role||'')}</span>`}
function naturalCompare(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}
async function loadRefs(){let [l,w,c]=await Promise.all([sb.from('leases').select('*').order('name'),sb.from('wells').select('*'),sb.from('contractors').select('*').order('name')]);const leases=(l.data||[]).sort((a,b)=>naturalCompare(a.name,b.name));const wells=(w.data||[]).sort((a,b)=>naturalCompare(leaseNameFrom(leases,a.lease_id),leaseNameFrom(leases,b.lease_id))||naturalCompare(a.well_number,b.well_number));refs={leases,wells,contractors:c.data||[]}}
function leaseNameFrom(leases,id){return leases.find(x=>x.id===id)?.name||''}
function renderNav(){const nav=$('#nav');nav.innerHTML='';for(const [id,label] of modules){if(id==='admin'&&profile?.role!=='admin')continue;const b=document.createElement('button');b.textContent=label;b.className=current===id?'active':'';b.onclick=()=>go(id);nav.appendChild(b)}}
async function go(id){current=id;renderNav();$('#pageTitle').textContent=modules.find(x=>x[0]===id)?.[1]||id;$('#content').innerHTML='<div class="panel">Loading…</div>';await loadRefs();if(id==='dashboard')return dashboard();if(id==='status')return listStatus();if(id==='workovers')return listWorkovers();if(id==='incidents')return listIncidents();if(id==='acid')return listAcid();if(id==='chemical')return listChemical();if(id==='oil')return listOil();if(id==='equipment')return listEquipment();if(id==='wells')return listWells();if(id==='contractors')return listContractors();if(id==='admin')return listUsers()}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function openModal(title,body,onSave){const m=$('#modal');m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2 style="margin:0">${esc(title)}</h2><button class="btn" id="closeModal">Close</button></div><form id="modalForm">${body}<div class="actions"><button class="btn" type="button" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save</button></div></form></div>`;m.classList.remove('hidden');$('#closeModal').onclick=$('#cancelModal').onclick=()=>m.classList.add('hidden');$('#modalForm').onsubmit=async e=>{e.preventDefault();try{await onSave(new FormData(e.target));m.classList.add('hidden');toast('Saved');await go(current)}catch(err){toast(err.message||String(err))}}}
function options(items,val,label){return `<option value="">Select…</option>`+items.map(x=>`<option value="${x[val]}">${esc(label(x))}</option>`).join('')}
async function dashboard(){const [wo,inc,oil,stat]=await Promise.all([sb.from('workovers').select('id,state',{count:'exact',head:true}),sb.from('incidents').select('id,operational_status',{count:'exact',head:true}),sb.from('oil_sales_pickups').select('id',{count:'exact',head:true}).eq('status','awaiting_pickup'),sb.from('status_events').select('id',{count:'exact',head:true})]);$('#content').innerHTML=`<div class="grid"><div class="card metric"><div class="label">Workovers</div><div class="value">${wo.count||0}</div></div><div class="card metric"><div class="label">Incidents</div><div class="value">${inc.count||0}</div></div><div class="card metric"><div class="label">Tanks Awaiting Pickup</div><div class="value">${oil.count||0}</div></div><div class="card metric"><div class="label">Status Events</div><div class="value">${stat.count||0}</div></div></div><div class="panel" style="margin-top:16px"><h2>Operations system</h2><div class="notice">Persistent Supabase storage is connected. Operational changes are subject to database RLS and audit history.</div><div class="two"><div><b>Current role</b><div class="muted">${esc(profile.role)}</div></div><div><b>Well master records</b><div class="muted">${refs.wells.length} wells loaded</div></div></div></div>`}
function wellForm(x={}){return `<div class="formgrid">
<div class="field"><label>Lease</label><select name="lease_id" required>${`<option value="">Select…</option>`+refs.leases.map(l=>`<option value="${l.id}"${selected(x.lease_id,l.id)}>${esc(l.name)}</option>`).join('')}</select></div>
<div class="field"><label>Well number</label><input name="well_number" required value="${esc(x.well_number||'')}"></div>
<div class="field"><label>Well type</label><input name="well_type" value="${esc(x.well_type||'')}"></div>
<div class="field"><label>Current status</label><input name="current_status" value="${esc(x.current_status||'')}"></div>
<div class="field"><label>Latitude</label><input name="latitude" type="number" step="0.0000001" value="${esc(x.latitude??'')}"></div>
<div class="field"><label>Longitude</label><input name="longitude" type="number" step="0.0000001" value="${esc(x.longitude??'')}"></div>
<div class="field"><label><input type="checkbox" name="active" style="width:auto" ${x.active===false?'':'checked'}> Active well</label></div>
<div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>
</div>`}
function wellPayload(f){const o=Object.fromEntries(f);for(const k of ['latitude','longitude'])o[k]=o[k]!==''?Number(o[k]):null;o.active=f.get('active')==='on';for(const k of ['well_type','current_status','notes'])if(!o[k])o[k]=null;return o}
async function editWell(id){const {data,error}=await sb.from('wells').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit well: ${wellName(id)}`,wellForm(data),async f=>{const {error}=await sb.from('wells').update(wellPayload(f)).eq('id',id);if(error)throw error})}
async function listWells(){const canEdit=['admin','supervisor','office'].includes(profile?.role);const rows=refs.wells.map(w=>`<tr><td>${canEdit?`<button class="btn editWell" data-id="${w.id}">Open / Edit</button>`:''}</td><td>${esc(leaseName(w.lease_id))}</td><td>${esc(w.well_number)}</td><td>${esc(w.well_type||'')}</td><td>${badge(w.current_status||'')}</td><td>${esc(w.latitude||'')}</td><td>${esc(w.longitude||'')}</td></tr>`);$('#content').innerHTML=`<div class="panel"><div class="toolbar">${canEdit?'<button class="btn primary" id="newWell">New well</button>':''}</div><div class="notice">Existing Well Master records can be reopened and updated by authorized roles. Changes remain subject to database audit/history rules.</div>${table(['Action','Lease','Well','Type','Status','Latitude','Longitude'],rows)}</div>`;document.querySelectorAll('.editWell').forEach(b=>b.onclick=()=>editWell(b.dataset.id));if(canEdit)$('#newWell').onclick=()=>openModal('New well',wellForm({active:true}),async f=>{const {error}=await sb.from('wells').insert(wellPayload(f));if(error)throw error})}
function contractorForm(x={}){return `<div class="formgrid">
<div class="field"><label>Company / contractor name</label><input name="name" required value="${esc(x.name||'')}"></div>
<div class="field"><label>Contact person</label><input name="contact_name" value="${esc(x.contact_name||'')}"></div>
<div class="field"><label>Phone</label><input name="phone" inputmode="tel" value="${esc(x.phone||'')}"></div>
<div class="field"><label>Email</label><input type="email" name="email" value="${esc(x.email||'')}"></div>
<div class="field"><label>Status</label><select name="status"><option value="preferred"${selected(x.status,'preferred')}>Preferred</option><option value="approved"${selected(x.status||'approved','approved')}>Approved</option><option value="emergency"${selected(x.status,'emergency')}>Emergency</option><option value="inactive"${selected(x.status,'inactive')}>Inactive</option></select></div>
<div class="field full"><label>Service categories (comma separated)</label><input name="services" value="${esc((x.service_categories||[]).join(', '))}" placeholder="Pulling Unit, Welding, Vacuum Truck"></div>
<div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>
</div>`}
function contractorPayload(f){const o=Object.fromEntries(f);o.service_categories=o.services?o.services.split(',').map(v=>v.trim()).filter(Boolean):[];delete o.services;for(const k of ['contact_name','phone','email','notes'])if(!o[k])o[k]=null;return o}
async function editContractor(id){const {data,error}=await sb.from('contractors').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit contractor: ${data.name}`,contractorForm(data),async f=>{const {error}=await sb.from('contractors').update(contractorPayload(f)).eq('id',id);if(error)throw error})}
async function listContractors(){const {data=[]}=await sb.from('contractors').select('*').order('name');const canEdit=['admin','supervisor','office'].includes(profile?.role);const rows=data.map(x=>`<tr><td>${canEdit?`<button class="btn editC" data-id="${x.id}">Edit</button>`:''}</td><td>${esc(x.name)}</td><td>${esc(x.contact_name||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.email||'')}</td><td>${badge(x.status)}</td><td>${esc((x.service_categories||[]).join(', '))}</td><td>${esc(x.notes||'')}</td></tr>`);$('#content').innerHTML=`<div class="panel"><div class="toolbar">${canEdit?'<button class="btn primary" id="newC">Add contractor / vendor</button>':''}</div><div class="notice">Contractor and vendor information is shared anywhere the app uses a contractor selector.</div>${table(['Action','Company','Contact','Phone','Email','Status','Services','Notes'],rows)}</div>`;document.querySelectorAll('.editC').forEach(b=>b.onclick=()=>editContractor(b.dataset.id));if(canEdit)$('#newC').onclick=()=>openModal('Add contractor / vendor',contractorForm({status:'approved'}),async f=>{const {error}=await sb.from('contractors').insert(contractorPayload(f));if(error)throw error})}
function statusForm(x={}){return `<div class="formgrid">
<div class="field"><label>Well</label><select name="well_id" required>${`<option value="">Select…</option>`+refs.wells.map(w=>`<option value="${w.id}"${selected(x.well_id,w.id)}>${esc(wellName(w.id))}</option>`).join('')}</select></div>
<div class="field"><label>Event date/time</label><input type="datetime-local" name="event_at" required value="${esc(dtlocal(x.event_at||new Date()))}"></div>
<div class="field"><label>Status</label><select name="status" required>${['Running','Down','Shut-In','Waiting on Pulling Unit','Under Workover','Mechanical Repair','Electrical Repair','Line/Facility Issue','Testing/Monitoring','Other'].map(v=>`<option${selected(x.status||'Running',v)}>${v}</option>`).join('')}</select></div>
<div class="field"><label>Contractor</label><select name="contractor_id">${`<option value="">Select…</option>`+refs.contractors.map(c=>`<option value="${c.id}"${selected(x.contractor_id,c.id)}>${esc(c.name)}</option>`).join('')}</select></div>
<div class="field full"><label>Observation</label><textarea name="observation">${esc(x.observation||'')}</textarea></div>
<div class="field full"><label>Suspected cause</label><textarea name="suspected_cause">${esc(x.suspected_cause||'')}</textarea></div>
<div class="field full"><label>Action taken</label><textarea name="action_taken">${esc(x.action_taken||'')}</textarea></div>
<div class="field full"><label>Current disposition</label><textarea name="disposition">${esc(x.disposition||'')}</textarea></div>
<div class="field"><label><input type="checkbox" name="follow_up_required" style="width:auto" ${x.follow_up_required?'checked':''}> Follow-up required</label></div>
<div class="field"><label>Follow-up note</label><input name="follow_up_note" value="${esc(x.follow_up_note||'')}"></div>
<div class="field"><label>Returned to production</label><input type="datetime-local" name="returned_to_production_at" value="${esc(dtlocal(x.returned_to_production_at))}"></div>
<div class="field"><label>Data quality</label><select name="data_quality">${['measured_verified','reported','estimated','unknown'].map(v=>`<option value="${v}"${selected(x.data_quality||'reported',v)}>${v}</option>`).join('')}</select></div>
<div class="field full"><label>Source</label><input name="source" value="${esc(x.source||'')}"></div>
</div>`}
function statusPayload(f){const o=Object.fromEntries(f);o.event_at=iso(o.event_at);o.returned_to_production_at=iso(o.returned_to_production_at);o.follow_up_required=f.get('follow_up_required')==='on';if(!o.contractor_id)o.contractor_id=null;for(const k of ['observation','suspected_cause','action_taken','disposition','follow_up_note','source'])if(!o[k])o[k]=null;return o}
async function editStatus(id){const {data,error}=await sb.from('status_events').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit status: ${wellName(data.well_id)}`,statusForm(data),async f=>{const {error}=await sb.from('status_events').update(statusPayload(f)).eq('id',id);if(error)throw error})}
async function listStatus(){const {data=[]}=await sb.from('status_events').select('*').order('event_at',{ascending:false}).limit(100);const rows=data.map(x=>`<tr><td><button class="btn editStatus" data-id="${x.id}">Open / Edit</button></td><td>${new Date(x.event_at).toLocaleString()}</td><td>${esc(wellName(x.well_id))}</td><td>${badge(x.status)}</td><td>${esc(x.observation||'')}</td><td>${esc(x.action_taken||'')}</td><td>${x.follow_up_required?badge('Follow-up'):''}</td></tr>`);$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" id="newS">New status event</button></div>${table(['Action','Date/Time','Well','Status','Observation','Action Taken','Follow-up'],rows)}</div>`;document.querySelectorAll('.editStatus').forEach(b=>b.onclick=()=>editStatus(b.dataset.id));$('#newS').onclick=()=>openModal('Daily operations status',statusForm({data_quality:'reported'}),async f=>{const o=statusPayload(f);o.created_by=me.id;const {error}=await sb.from('status_events').insert(o);if(error)throw error})}
function selected(a,b){return String(a??'')===String(b??'')?' selected':''}
function workoverForm(x={}){return `<div class="formgrid">
<div class="field"><label>Well</label><select name="well_id" required>${`<option value="">Select…</option>`+refs.wells.map(w=>`<option value="${w.id}"${selected(x.well_id,w.id)}>${esc(wellName(w.id))}</option>`).join('')}</select></div>

<div class="field"><label>Unit</label><input name="quantity_unit" placeholder="gal, qt, lb" value="${esc(x.quantity_unit||'')}"></div>
<div class="field"><label>Duration minutes</label><input type="number" name="duration_minutes" value="${esc(x.duration_minutes??'')}"></div>
<div class="field"><label>Treatment method</label><select name="treatment_method"><option value="">Select…</option>${['Circulated','Injected','Batch Treated'].map(v=>`<option${selected(x.treatment_method,v)}>${v}</option>`).join('')}</select></div>
<div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>
</div>`}
function chemicalPayload(f){const o=Object.fromEntries(f);o.treatment_at=iso(o.treatment_at);for(const k of ['quantity','duration_minutes'])o[k]=o[k]!==''?Number(o[k]):null;if(!o.lease_id)o.lease_id=null;if(!o.well_id)o.well_id=null;for(const k of ['target_description','quantity_unit','treatment_method','notes'])if(!o[k])o[k]=null;return o}
async function editChemical(id){const {data,error}=await sb.from('chemical_treatments').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit chemical treatment`,chemicalForm(data),async f=>{const {error}=await sb.from('chemical_treatments').update(chemicalPayload(f)).eq('id',id);if(error)throw error})}
async function listChemical(){const {data=[]}=await sb.from('chemical_treatments').select('*').order('treatment_at',{ascending:false});const rows=data.map(x=>`<tr><td><button class="btn editChem" data-id="${x.id}">Open / Edit</button></td><td>${new Date(x.treatment_at).toLocaleString()}</td><td>${esc(x.well_id?wellName(x.well_id):leaseName(x.lease_id))}</td><td>${esc(x.target_type)}</td><td>${esc(x.chemical_product)}</td><td>${esc(x.quantity??'')} ${esc(x.quantity_unit||'')}</td><td>${esc(x.route_method)}</td><td>${esc(x.duration_minutes??'')}</td></tr>`);$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" id="newCh">New treatment</button></div>${table(['Action','Date','Target','Type','Chemical','Quantity','Route','Minutes'],rows)}</div>`;document.querySelectorAll('.editChem').forEach(b=>b.onclick=()=>editChemical(b.dataset.id));$('#newCh').onclick=()=>openModal('Chemical treatment',chemicalForm({state:'draft'}),async f=>{const o=chemicalPayload(f);o.created_by=me.id;const {error}=await sb.from('chemical_treatments').insert(o);if(error)throw error})}
const OIL_BATTERIES=[
 {value:'csf',label:'Catlett–Sands–Foraker Battery',leases:['Catlett','Sands','Foraker']},
 {value:'cbg',label:'Chapman–Borrums–Gibbs Battery',leases:['Chapman','Borrums','Gibbs']},
 {value:'Chance',label:'Chance Battery',leases:['Chance']},
 {value:'James',label:'James Battery',leases:['James']},
 {value:'Liz',label:'Liz Battery',leases:['Liz']},
 {value:'Mac',label:'Mac Battery',leases:['Mac']},
 {value:'Newly',label:'Newly Battery',leases:['Newly']},
 {value:'Nomo',label:'Nomo Battery',leases:['Nomo']}
];
function oilBatteryForRecord(x={}){
 const n=leaseName(x.lease_id);
 if(['Catlett','Sands','Foraker'].includes(n))return 'csf';
 if(['Chapman','Borrums','Gibbs'].includes(n))return 'cbg';
 return n||'';
}
function oilBatteryLabel(x={}){const v=oilBatteryForRecord(x);return OIL_BATTERIES.find(b=>b.value===v)?.label||(leaseName(x.lease_id)||'');}
function oilBatteryLeaseId(v){
 const b=OIL_BATTERIES.find(x=>x.value===v);if(!b)return null;
 // Existing schema stores lease_id. Use a stable representative lease for consolidated batteries while UI/reporting uses the battery name.
 const representative=v==='csf'?'Catlett':v==='cbg'?'Chapman':b.leases[0];
 return refs.leases.find(l=>l.name===representative)?.id||null;
}
function oilForm(x={}){const bv=oilBatteryForRecord(x);return `<div class="formgrid">
<div class="field"><label>Sales battery</label><select name="battery" required><option value="">Select…</option>${OIL_BATTERIES.filter(b=>b.leases.some(n=>refs.leases.some(l=>l.name===n))).map(b=>`<option value="${b.value}"${selected(bv,b.value)}>${esc(b.label)}</option>`).join('')}</select></div>
<div class="field"><label>Tank number</label><input name="tank_number" required value="${esc(x.tank_number||'')}"></div>
<div class="field"><label>Purchaser</label><input name="purchaser" value="${esc(x.purchaser||'')}"></div>
<div class="field"><label>Confirmation number</label><input name="confirmation_number" value="${esc(x.confirmation_number||'')}"></div>
<div class="field"><label>Called in date/time</label><input type="datetime-local" name="called_in_at" value="${esc(dtlocal(x.called_in_at))}"></div>
<div class="field"><label>Picked up date/time</label><input type="datetime-local" name="picked_up_at" value="${esc(dtlocal(x.picked_up_at))}"></div>
<div class="field"><label>Status</label><select name="status"><option value="awaiting_pickup"${selected(x.status||'awaiting_pickup','awaiting_pickup')}>awaiting_pickup</option><option value="picked_up"${selected(x.status,'picked_up')}>picked_up</option></select></div>
<div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>
</div>`}
function oilPayload(f){const o=Object.fromEntries(f);o.lease_id=oilBatteryLeaseId(o.battery);delete o.battery;o.called_in_at=iso(o.called_in_at);o.picked_up_at=iso(o.picked_up_at);for(const k of ['purchaser','confirmation_number','notes'])if(!o[k])o[k]=null;return o}
async function editOil(id){const {data,error}=await sb.from('oil_sales_pickups').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit oil sale / pickup`,oilForm(data),async f=>{const {error}=await sb.from('oil_sales_pickups').update(oilPayload(f)).eq('id',id);if(error)throw error})}
async function listOil(){const {data=[]}=await sb.from('oil_sales_pickups').select('*').order('called_in_at',{ascending:false});const rows=data.map(x=>{let delay='';if(x.called_in_at&&x.picked_up_at)delay=((new Date(x.picked_up_at)-new Date(x.called_in_at))/36e5).toFixed(1)+' hr';return `<tr><td><button class="btn editOil" data-id="${x.id}">Open / Edit</button></td><td>${esc(oilBatteryLabel(x))}</td><td>${esc(x.tank_number)}</td><td>${esc(x.purchaser||'')}</td><td>${esc(x.confirmation_number||'')}</td><td>${x.called_in_at?new Date(x.called_in_at).toLocaleString():''}</td><td>${x.picked_up_at?new Date(x.picked_up_at).toLocaleString():''}</td><td>${badge(x.status)}</td><td>${delay}</td></tr>`});$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" id="newO">New call-in</button></div><div class="notice">Oil sales are recorded by sales battery. Catlett–Sands–Foraker and Chapman–Borrums–Gibbs are consolidated batteries.</div>${table(['Action','Sales Battery','Tank','Purchaser','Confirmation','Called In','Picked Up','Status','Delay'],rows)}</div>`;document.querySelectorAll('.editOil').forEach(b=>b.onclick=()=>editOil(b.dataset.id));$('#newO').onclick=()=>openModal('Oil sale / pickup',oilForm({status:'awaiting_pickup'}),async f=>{const o=oilPayload(f);o.created_by=me.id;const {error}=await sb.from('oil_sales_pickups').insert(o);if(error)throw error})}
function equipmentForm(x={}){return `<div class="formgrid">
<div class="field"><label>Lease</label><select name="lease_id">${`<option value="">Select…</option>`+refs.leases.map(l=>`<option value="${l.id}"${selected(x.lease_id,l.id)}>${esc(l.name)}</option>`).join('')}</select></div>
<div class="field"><label>Well</label><select name="well_id">${`<option value="">Select…</option>`+refs.wells.map(w=>`<option value="${w.id}"${selected(x.well_id,w.id)}>${esc(wellName(w.id))}</option>`).join('')}</select></div>
<div class="field"><label>Equipment type</label><input name="equipment_type" required value="${esc(x.equipment_type||'')}"></div>
<div class="field"><label>Manufacturer</label><input name="manufacturer" value="${esc(x.manufacturer||'')}"></div>
<div class="field"><label>Model</label><input name="model" value="${esc(x.model||'')}"></div>
<div class="field"><label>Serial number</label><input name="serial_number" value="${esc(x.serial_number||'')}"></div>
<div class="field"><label>Status</label><input name="status" value="${esc(x.status||'')}"></div>
<div class="field"><label>Installed date/time</label><input type="datetime-local" name="installed_at" value="${esc(dtlocal(x.installed_at))}"></div>
<div class="field"><label>Removed date/time</label><input type="datetime-local" name="removed_at" value="${esc(dtlocal(x.removed_at))}"></div>
<div class="field full"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>
</div>`}
function equipmentPayload(f){const o=Object.fromEntries(f);if(!o.lease_id)o.lease_id=null;if(!o.well_id)o.well_id=null;o.installed_at=iso(o.installed_at);o.removed_at=iso(o.removed_at);for(const k of ['manufacturer','model','serial_number','status','notes'])if(!o[k])o[k]=null;return o}
async function editEquipment(id){const {data,error}=await sb.from('equipment').select('*').eq('id',id).single();if(error)return toast(error.message);openModal(`Edit equipment`,equipmentForm(data),async f=>{const {error}=await sb.from('equipment').update(equipmentPayload(f)).eq('id',id);if(error)throw error})}
async function listEquipment(){const {data=[]}=await sb.from('equipment').select('*').order('created_at',{ascending:false});const rows=data.map(x=>`<tr><td><button class="btn editEquipment" data-id="${x.id}">Open / Edit</button></td><td>${esc(x.well_id?wellName(x.well_id):leaseName(x.lease_id))}</td><td>${esc(x.equipment_type)}</td><td>${esc(x.manufacturer||'')}</td><td>${esc(x.model||'')}</td><td>${esc(x.serial_number||'')}</td><td>${esc(x.status||'')}</td></tr>`);$('#content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" id="newE">New equipment</button></div>${table(['Action','Location','Type','Manufacturer','Model','Serial','Status'],rows)}</div>`;document.querySelectorAll('.editEquipment').forEach(b=>b.onclick=()=>editEquipment(b.dataset.id));$('#newE').onclick=()=>openModal('Equipment record',equipmentForm({}),async f=>{const o=equipmentPayload(f);o.created_by=me.id;const {error}=await sb.from('equipment').insert(o);if(error)throw error})}
async function listUsers(){if(profile.role!=='admin')return;const {data=[]}=await sb.from('profiles').select('*').order('created_at');const rows=data.map(x=>`<tr><td>${esc(x.display_name||'')}</td><td>${badge(x.role)}</td><td>${x.active?'Active':'Inactive'}</td><td><select data-role="${x.user_id}" class="roleSel"><option ${x.role==='admin'?'selected':''}>admin</option><option ${x.role==='supervisor'?'selected':''}>supervisor</option><option ${x.role==='field_operator'?'selected':''}>field_operator</option><option ${x.role==='office'?'selected':''}>office</option><option ${x.role==='contractor'?'selected':''}>contractor</option><option ${x.role==='read_only'?'selected':''}>read_only</option></select></td></tr>`);$('#content').innerHTML=`<div class="panel"><h2>Users and roles</h2><div class="notice">Changing a role changes database-enforced access. Use the least privilege the person actually needs.</div>${table(['User','Role','Status','Change role'],rows)}</div>`;document.querySelectorAll('.roleSel').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('profiles').update({role:s.value}).eq('user_id',s.dataset.role);if(error)return toast(error.message);toast('Role updated')})}
const REMEMBERED_EMAIL_KEY='oilfield_ops_remembered_email';
function saveRememberedEmail(){const email=$('#authEmail').value.trim();if($('#rememberEmail').checked&&email)localStorage.setItem(REMEMBERED_EMAIL_KEY,email);else localStorage.removeItem(REMEMBERED_EMAIL_KEY)}
function loadRememberedEmail(){const email=localStorage.getItem(REMEMBERED_EMAIL_KEY);if(email){$('#authEmail').value=email;$('#rememberEmail').checked=true}}
loadRememberedEmail();
$('#authForm').onsubmit=async e=>{e.preventDefault();saveRememberedEmail();const {error}=await sb.auth.signInWithPassword({email:$('#authEmail').value.trim(),password:$('#authPassword').value});if(error)toast(error.message)};
$('#signupBtn').onclick=async()=>{saveRememberedEmail();const {error}=await sb.auth.signUp({email:$('#authEmail').value.trim(),password:$('#authPassword').value});if(error)toast(error.message);else toast('Account created. Check email if confirmation is enabled.')};
$('#signout').onclick=()=>sb.auth.signOut();
async function sessionChanged(session){if(!session){me=profile=null;$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');return}me=session.user;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await loadProfile();await loadRefs();renderNav();await go(current)}
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>sessionChanged(s),0));sb.auth.getSession().then(({data})=>sessionChanged(data.session));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
